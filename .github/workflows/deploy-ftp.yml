name: FTP 发布站点

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: z-pic-auto-ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: 上传到 FTP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 获取代码
        uses: actions/checkout@v6

      - name: 检查 FTP 配置
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          for variable in FTP_HOST FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            if [[ -z "${!variable}" ]]; then
              echo "缺少 GitHub Secret: ${variable}" >&2
              exit 1
            fi
          done

      - name: Resolve FTP target directory
        id: resolve_ftp_dir
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from ftplib import FTP

          configured = os.environ["FTP_SERVER_DIR"].strip()
          relative = configured.lstrip("/") or "./"
          candidates = [relative]
          if configured != relative:
              candidates.append(configured)
          if "./" not in candidates:
              candidates.append("./")
          failures = []

          for candidate in candidates:
              ftp = FTP()
              try:
                  ftp.connect(os.environ["FTP_HOST"], 21, timeout=30)
                  ftp.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])
                  login_dir = ftp.pwd()
                  ftp.cwd(candidate)
                  target_dir = ftp.pwd()
                  print(f"FTP login directory: {login_dir}")
                  print(f"FTP target directory: {target_dir}")
                  try:
                      ftp.cwd("admin")
                      print(f"FTP admin directory: {ftp.pwd()}")
                  except Exception as error:
                      print(f"FTP admin directory check failed under {target_dir}: {error}")
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                      output.write(f"server_dir={candidate}\n")
                  break
              except Exception as error:
                  failures.append(f"{candidate}: {error}")
              finally:
                  try:
                      ftp.quit()
                  except Exception:
                      pass
          else:
              print("FTP target directory validation failed:")
              for failure in failures:
                  print(f"- {failure}")
              raise SystemExit(1)
          PY

      - name: Check production configuration
        id: production_config
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ steps.resolve_ftp_dir.outputs.server_dir }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from ftplib import FTP

          ftp = FTP()
          needs_init = True
          try:
              ftp.connect(os.environ["FTP_HOST"], 21, timeout=30)
              ftp.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])
              ftp.cwd(os.environ["FTP_SERVER_DIR"])
              try:
                  ftp.cwd("config")
              except Exception:
                  needs_init = True
              else:
                  try:
                      needs_init = not bool(ftp.size("local.php"))
                  except Exception:
                      needs_init = True
          finally:
              try:
                  ftp.quit()
              except Exception:
                  pass

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"needs_init={'true' if needs_init else 'false'}\n")
          print(f"production_config_needs_init={needs_init}")
          PY

      - name: Initialize production configuration when missing
        if: ${{ steps.production_config.outputs.needs_init == 'true' }}
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ steps.resolve_ftp_dir.outputs.server_dir }}
          SITE_URL: ${{ secrets.SITE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          VERIFY_SSL: ${{ secrets.VERIFY_SSL }}
        shell: bash
        run: |
          set -euo pipefail
          for variable in SITE_URL ADMIN_TOKEN DB_HOST DB_NAME DB_PASSWORD DB_PORT DB_USERNAME; do
            if [[ -z "${!variable}" ]]; then
              echo "缺少 GitHub Secret: ${variable}" >&2
              exit 1
            fi
          done

          python - <<'PY'
          import json
          import os
          import textwrap
          from ftplib import FTP
          from io import BytesIO

          def php_string(value):
              return json.dumps(value, ensure_ascii=True)

          def php_bool(value):
              return "false" if value.strip().lower() in {"0", "false", "no"} else "true"

          content = f"""<?php
          declare(strict_types=1);

          return [
              'site_url' => {php_string(os.environ['SITE_URL'].rstrip('/'))},
              'admin_token' => {php_string(os.environ['ADMIN_TOKEN'])},
              'database' => [
                  'driver' => 'mysql',
                  'host' => {php_string(os.environ['DB_HOST'])},
                  'port' => {int(os.environ['DB_PORT'])},
                  'name' => {php_string(os.environ['DB_NAME'])},
                  'user' => {php_string(os.environ['DB_USERNAME'])},
                  'password' => {php_string(os.environ['DB_PASSWORD'])},
                  'charset' => 'utf8',
              ],
              'verify_ssl' => {php_bool(os.environ.get('VERIFY_SSL', '1'))},
          ];
          """
          content = textwrap.dedent(content)

          ftp = FTP()
          try:
              ftp.connect(os.environ["FTP_HOST"], 21, timeout=30)
              ftp.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])
              ftp.cwd(os.environ["FTP_SERVER_DIR"])
              try:
                  ftp.cwd("config")
              except Exception:
                  ftp.mkd("config")
                  ftp.cwd("config")
              ftp.storbinary("STOR local.php", BytesIO(content.encode("utf-8")))
          finally:
              try:
                  ftp.quit()
              except Exception:
                  pass
          print("production_config_initialized=true")
          PY

      - name: Sync site files (attempt 1)
        id: ftp_deploy_attempt_1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ${{ steps.resolve_ftp_dir.outputs.server_dir }}
          state-name: .ftp-deploy-sync-state.json
          log-level: minimal
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.codex/**
            **/.ftp-deploy-sync-state.json
            **/.env
            **/config/local.php
            **/config/local.php72
            **/storage/**
            **/storage-php72/**
            **/tests/**
            **/docker-compose*.yml
            **/Dockerfile*

      - name: Wait before FTP retry 2
        if: ${{ steps.ftp_deploy_attempt_1.outcome == 'failure' }}
        shell: bash
        run: sleep 10

      - name: Sync site files (attempt 2)
        id: ftp_deploy_attempt_2
        if: ${{ steps.ftp_deploy_attempt_1.outcome == 'failure' }}
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ${{ steps.resolve_ftp_dir.outputs.server_dir }}
          state-name: .ftp-deploy-sync-state.json
          log-level: minimal
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.codex/**
            **/.ftp-deploy-sync-state.json
            **/.env
            **/config/local.php
            **/config/local.php72
            **/storage/**
            **/storage-php72/**
            **/tests/**
            **/docker-compose*.yml
            **/Dockerfile*

      - name: Wait before FTP retry 3
        if: ${{ steps.ftp_deploy_attempt_2.outcome == 'failure' }}
        shell: bash
        run: sleep 20

      - name: Sync site files (attempt 3)
        id: ftp_deploy_attempt_3
        if: ${{ steps.ftp_deploy_attempt_2.outcome == 'failure' }}
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ${{ steps.resolve_ftp_dir.outputs.server_dir }}
          state-name: .ftp-deploy-sync-state.json
          log-level: minimal
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.codex/**
            **/.ftp-deploy-sync-state.json
            **/.env
            **/config/local.php
            **/config/local.php72
            **/storage/**
            **/storage-php72/**
            **/tests/**
            **/docker-compose*.yml
            **/Dockerfile*

      - name: Fail if all FTP attempts failed
        if: ${{ steps.ftp_deploy_attempt_3.outcome == 'failure' }}
        shell: bash
        run: exit 1
