name: Tailscale SSH 发布站点

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: z-pic-auto-ssh-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: 通过 Tailscale SSH 上传
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 获取代码
        uses: actions/checkout@v6

      - name: 检查部署配置
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_SERVER_DIR: ${{ secrets.SSH_SERVER_DIR }}
          SITE_URL: ${{ secrets.SITE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_CHARSET: ${{ secrets.DB_CHARSET }}
        shell: bash
        run: |
          set -euo pipefail
          for variable in \
            TS_OAUTH_CLIENT_ID TS_AUDIENCE SSH_HOST SSH_USERNAME \
            SSH_PRIVATE_KEY SSH_KNOWN_HOSTS SSH_SERVER_DIR SITE_URL \
            ADMIN_TOKEN DB_HOST DB_PORT DB_NAME DB_USERNAME DB_PASSWORD DB_CHARSET; do
            if [[ -z "${!variable}" ]]; then
              echo "缺少 GitHub Secret: ${variable}" >&2
              exit 1
            fi
          done

          if [[ "${SSH_SERVER_DIR}" != /* || "${SSH_SERVER_DIR}" == "/" ]]; then
            echo "SSH_SERVER_DIR 必须使用非根目录的绝对路径，例如 /var/www/site" >&2
            exit 1
          fi
          if [[ "${SSH_SERVER_DIR}" == *$'\n'* || "${SSH_SERVER_DIR}" == *$'\r'* || "${SSH_SERVER_DIR}" == *"'"* ]]; then
            echo "SSH_SERVER_DIR 不能包含换行或单引号" >&2
            exit 1
          fi

      - name: 连接 Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      - name: 准备 SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SSH_PRIVATE_KEY_PASSPHRASE }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/id_ed25519" "${HOME}/.ssh/known_hosts"

          eval "$(ssh-agent -s)"
          if [[ -n "${SSH_PRIVATE_KEY_PASSPHRASE:-}" ]]; then
            askpass="${RUNNER_TEMP}/ssh-askpass"
            printf '%s\n' '#!/usr/bin/env bash' 'printf "%s\\n" "${SSH_PRIVATE_KEY_PASSPHRASE}"' > "${askpass}"
            chmod 700 "${askpass}"
            export SSH_ASKPASS="${askpass}"
            export SSH_ASKPASS_REQUIRE=force
            export DISPLAY=:0
            ssh-add "${HOME}/.ssh/id_ed25519" < /dev/null
            rm -f "${askpass}"
            unset SSH_ASKPASS SSH_ASKPASS_REQUIRE DISPLAY
          else
            ssh-add "${HOME}/.ssh/id_ed25519"
          fi
          echo "SSH_AUTH_SOCK=${SSH_AUTH_SOCK}" >> "${GITHUB_ENV}"
          echo "SSH_AGENT_PID=${SSH_AGENT_PID}" >> "${GITHUB_ENV}"

      - name: 生成生产配置
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_CHARSET: ${{ secrets.DB_CHARSET }}
          VERIFY_SSL: ${{ secrets.VERIFY_SSL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def php_string(value):
              return json.dumps(value, ensure_ascii=True)

          def php_bool(value):
              return "false" if value.strip().lower() in {"0", "false", "no"} else "true"

          lines = [
              "<?php",
              "declare(strict_types=1);",
              "",
              "return [",
              f"    'site_url' => {php_string(os.environ['SITE_URL'].rstrip('/'))},",
              f"    'admin_token' => {php_string(os.environ['ADMIN_TOKEN'])},",
              "    'database' => [",
              "        'driver' => 'mysql',",
              f"        'host' => {php_string(os.environ['DB_HOST'])},",
              f"        'port' => {int(os.environ['DB_PORT'])},",
              f"        'name' => {php_string(os.environ['DB_NAME'])},",
              f"        'user' => {php_string(os.environ['DB_USERNAME'])},",
              f"        'password' => {php_string(os.environ['DB_PASSWORD'])},",
              f"        'charset' => {php_string(os.environ['DB_CHARSET'].strip())},",
              "    ],",
              f"    'verify_ssl' => {php_bool(os.environ.get('VERIFY_SSL', '1'))},",
          ]

          pexels_api_key = os.environ.get('PEXELS_API_KEY', '').strip()
          if pexels_api_key:
              lines.append(f"    'pexels_api_key' => {php_string(pexels_api_key)},")

          lines.append("    'sources' => [")
          if pexels_api_key:
              lines.extend([
                  "        5 => [",
                  "            'name' => 'Pexels 精选图片',",
                  "            'type' => 'pexels',",
                  "            'url' => 'https://api.pexels.com/v1/curated',",
                  "            'enabled' => true,",
                  "            'per_page' => 1,",
                  "            'max_items' => 1,",
                  "            'max_images' => 1,",
                  "            'image_size' => 'large',",
                  "            'request_timeout' => 20,",
                  "        ],",
              ])
          lines.extend([
              "        6 => [",
              "            'name' => 'Bangumi 动画条目',",
              "            'type' => 'bangumi',",
              "            'url' => 'https://api.bgm.tv/v0/subjects',",
              "            'enabled' => true,",
              "            'params' => [",
              "                'type' => 2,",
              "                'sort' => 'rank',",
              "                'limit' => 1,",
              "                'offset' => 0,",
              "            ],",
              "            'category' => '二次元',",
              "            'max_items' => 1,",
              "            'max_images' => 1,",
              "            'request_timeout' => 20,",
              "        ],",
              "    ],",
              "];",
          ])

          expected = "\n".join(lines).encode("utf-8")
          expected_text = expected.decode("utf-8")
          if "'type' => 'bangumi'" not in expected_text or "'category' => '二次元'" not in expected_text:
              raise RuntimeError("生成的 config/local.php 缺少 Bangumi 来源配置。")

          output_path = Path(os.environ["RUNNER_TEMP"]) / "z-pic-auto-local.php"
          output_path.write_bytes(expected)
          print(f"production_config_path={output_path}")
          print("production_config_verified=true")
          PY

      - name: 检查 SSH 目标
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_SERVER_DIR: ${{ secrets.SSH_SERVER_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          remote="${SSH_USERNAME}@${SSH_HOST}"
          ssh -p "${SSH_PORT}" "${remote}" \
            "mkdir -p -- '${SSH_SERVER_DIR%/}/config' && test -d '${SSH_SERVER_DIR%/}'"

      - name: 通过 SSH 同步配置和站点文件
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_SERVER_DIR: ${{ secrets.SSH_SERVER_DIR }}
          PRODUCTION_CONFIG_PATH: ${{ runner.temp }}/z-pic-auto-local.php
        shell: bash
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          remote="${SSH_USERNAME}@${SSH_HOST}"
          target_dir="${SSH_SERVER_DIR%/}"

          deploy_once() {
            scp -P "${SSH_PORT}" "${PRODUCTION_CONFIG_PATH}" \
              "${remote}:${target_dir}/config/local.php"

            rsync -az --delete-delay --partial \
              --exclude='**/.git*' \
              --exclude='**/.git*/**' \
              --exclude='**/.github/**' \
              --exclude='**/.codex/**' \
              --exclude='**/.ftp-deploy-sync-state.json' \
              --exclude='**/.env' \
              --exclude='**/config/local.php' \
              --exclude='**/config/local.php72' \
              --exclude='**/storage/**' \
              --exclude='**/storage-php72/**' \
              --exclude='**/tests/**' \
              --exclude='**/docker-compose*.yml' \
              --exclude='**/Dockerfile*' \
              -e "ssh -p ${SSH_PORT}" \
              ./ "${remote}:${target_dir}/"

            ssh -p "${SSH_PORT}" "${remote}" \
              "test -s '${target_dir}/config/local.php'"
          }

          for attempt in 1 2 3; do
            if deploy_once; then
              echo "SSH 部署成功（第 ${attempt} 次尝试）。"
              exit 0
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              delay=$((attempt * 10))
              echo "SSH 部署失败，将在 ${delay} 秒后重试。" >&2
              sleep "${delay}"
            fi
          done

          echo "SSH 部署连续三次失败。" >&2
          exit 1
