name: FTP 发布站点

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: z-pic-auto-ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: 上传到 FTP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 获取代码
        uses: actions/checkout@v6

      - name: 检查 FTP 配置
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          for variable in FTP_HOST FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            if [[ -z "${!variable}" ]]; then
              echo "缺少 GitHub Secret: ${variable}" >&2
              exit 1
            fi
          done

      - name: Resolve FTP target directory
        id: resolve_ftp_dir
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from ftplib import FTP

          configured = os.environ["FTP_SERVER_DIR"].strip()
          if not configured.startswith("/"):
              raise SystemExit("FTP_SERVER_DIR 必须使用以 / 开头的绝对 FTP 目录，例如 /Web/")
          if "\n" in configured or "\r" in configured:
              raise SystemExit("FTP_SERVER_DIR 不能包含换行符")

          server_dir = "/" + configured.strip("/") + "/"
          if server_dir == "//":
              raise SystemExit("FTP_SERVER_DIR 不能指向 FTP 根目录")

          ftp = FTP()
          try:
              ftp.connect(os.environ["FTP_HOST"], 21, timeout=30)
              ftp.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])
              login_dir = ftp.pwd()
              ftp.cwd(server_dir)
              target_dir = ftp.pwd()
              print(f"FTP login directory: {login_dir}")
              print(f"FTP verified target directory: {target_dir}")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write(f"server_dir={server_dir}\n")
              print(f"FTP upload server-dir: {server_dir}")
          finally:
              try:
                  ftp.quit()
              except Exception:
                  pass
          PY

      - name: Synchronize production configuration
        id: production_config
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ steps.resolve_ftp_dir.outputs.server_dir }}
          SITE_URL: ${{ secrets.SITE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_CHARSET: ${{ secrets.DB_CHARSET }}
          VERIFY_SSL: ${{ secrets.VERIFY_SSL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for variable in SITE_URL ADMIN_TOKEN DB_HOST DB_PORT DB_NAME DB_USERNAME DB_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "缺少 GitHub Secret: ${variable}" >&2
              exit 1
            fi
          done

          python - <<'PY'
          import json
          import os
          from ftplib import FTP
          from io import BytesIO

          def php_string(value):
              return json.dumps(value, ensure_ascii=True)

          def php_bool(value):
              return "false" if value.strip().lower() in {"0", "false", "no"} else "true"

          lines = [
              "<?php",
              "declare(strict_types=1);",
              "",
              "return [",
              f"    'site_url' => {php_string(os.environ['SITE_URL'].rstrip('/'))},",
              f"    'admin_token' => {php_string(os.environ['ADMIN_TOKEN'])},",
              "    'database' => [",
              "        'driver' => 'mysql',",
              f"        'host' => {php_string(os.environ['DB_HOST'])},",
              f"        'port' => {int(os.environ['DB_PORT'])},",
              f"        'name' => {php_string(os.environ['DB_NAME'])},",
              f"        'user' => {php_string(os.environ['DB_USERNAME'])},",
              f"        'password' => {php_string(os.environ['DB_PASSWORD'])},",
              f"        'charset' => {php_string(os.environ.get('DB_CHARSET', '').strip() or 'utf8')},",
              "    ],",
              f"    'verify_ssl' => {php_bool(os.environ.get('VERIFY_SSL', '1'))},",
          ]
          pexels_api_key = os.environ.get('PEXELS_API_KEY', '').strip()
          if pexels_api_key:
              lines.append(f"    'pexels_api_key' => {php_string(pexels_api_key)},")
              lines.extend([
                  "    'sources' => [",
                  "        5 => [",
                  "            'name' => 'Pexels 精选图片',",
                  "            'type' => 'pexels',",
                  "            'url' => 'https://api.pexels.com/v1/curated',",
                  "            'enabled' => true,",
                  "            'per_page' => 1,",
                  "            'max_items' => 1,",
                  "            'max_images' => 1,",
                  "            'image_size' => 'large',",
                  "            'request_timeout' => 20,",
                  "        ],",
                  "    ],",
              ])
          lines.extend(["];", ""])
          expected = "\n".join(lines).encode("utf-8")

          ftp = FTP()
          remote = None
          try:
              ftp.connect(os.environ["FTP_HOST"], 21, timeout=30)
              ftp.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])
              ftp.cwd(os.environ["FTP_SERVER_DIR"])
              try:
                  ftp.cwd("config")
              except Exception:
                  ftp.mkd("config")
                  ftp.cwd("config")
              buffer = BytesIO()
              try:
                  ftp.retrbinary("RETR local.php", buffer.write)
                  remote = buffer.getvalue()
              except Exception:
                  remote = None
              needs_sync = remote != expected
              synced = False
              if needs_sync:
                  ftp.storbinary("STOR local.php", BytesIO(expected))
                  verification = BytesIO()
                  ftp.retrbinary("RETR local.php", verification.write)
                  if verification.getvalue() != expected:
                      raise RuntimeError("上传后的 config/local.php 回读内容不一致。")
                  synced = True
          finally:
              try:
                  ftp.quit()
              except Exception:
                  pass

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"needs_sync={'true' if needs_sync else 'false'}\n")
          print(f"production_config_needs_sync={needs_sync}")
          print(f"production_config_synced={synced}")
          print("production_config_verified=true")
          PY

      - name: Sync site files (attempt 1)
        id: ftp_deploy_attempt_1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ${{ steps.resolve_ftp_dir.outputs.server_dir }}
          state-name: .ftp-deploy-sync-state.json
          log-level: minimal
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.codex/**
            **/.ftp-deploy-sync-state.json
            **/.env
            **/config/local.php
            **/config/local.php72
            **/storage/**
            **/storage-php72/**
            **/tests/**
            **/docker-compose*.yml
            **/Dockerfile*

      - name: Wait before FTP retry 2
        if: ${{ steps.ftp_deploy_attempt_1.outcome == 'failure' }}
        shell: bash
        run: sleep 10

      - name: Sync site files (attempt 2)
        id: ftp_deploy_attempt_2
        if: ${{ steps.ftp_deploy_attempt_1.outcome == 'failure' }}
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ${{ steps.resolve_ftp_dir.outputs.server_dir }}
          state-name: .ftp-deploy-sync-state.json
          log-level: minimal
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.codex/**
            **/.ftp-deploy-sync-state.json
            **/.env
            **/config/local.php
            **/config/local.php72
            **/storage/**
            **/storage-php72/**
            **/tests/**
            **/docker-compose*.yml
            **/Dockerfile*

      - name: Wait before FTP retry 3
        if: ${{ steps.ftp_deploy_attempt_2.outcome == 'failure' }}
        shell: bash
        run: sleep 20

      - name: Sync site files (attempt 3)
        id: ftp_deploy_attempt_3
        if: ${{ steps.ftp_deploy_attempt_2.outcome == 'failure' }}
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ${{ steps.resolve_ftp_dir.outputs.server_dir }}
          state-name: .ftp-deploy-sync-state.json
          log-level: minimal
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.codex/**
            **/.ftp-deploy-sync-state.json
            **/.env
            **/config/local.php
            **/config/local.php72
            **/storage/**
            **/storage-php72/**
            **/tests/**
            **/docker-compose*.yml
            **/Dockerfile*

      - name: Fail if all FTP attempts failed
        if: ${{ steps.ftp_deploy_attempt_3.outcome == 'failure' }}
        shell: bash
        run: exit 1
