name: FTP 发布站点

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: z-pic-auto-ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: 上传到 FTP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 获取代码
        uses: actions/checkout@v6

      - name: 检查 FTP 配置
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          for variable in FTP_HOST FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            if [[ -z "${!variable}" ]]; then
              echo "缺少 GitHub Secret: ${variable}" >&2
              exit 1
            fi
          done

      - name: Resolve FTP target directory
        id: resolve_ftp_dir
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from ftplib import FTP

          configured = os.environ["FTP_SERVER_DIR"].strip()
          relative = configured.lstrip("/") or "./"
          candidates = [relative]
          if configured != relative:
              candidates.append(configured)
          if "./" not in candidates:
              candidates.append("./")
          failures = []

          for candidate in candidates:
              ftp = FTP()
              try:
                  ftp.connect(os.environ["FTP_HOST"], 21, timeout=30)
                  ftp.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])
                  login_dir = ftp.pwd()
                  ftp.cwd(candidate)
                  target_dir = ftp.pwd()
                  print(f"FTP login directory: {login_dir}")
                  print(f"FTP target directory: {target_dir}")
                  try:
                      ftp.cwd("admin")
                      print(f"FTP admin directory: {ftp.pwd()}")
                  except Exception as error:
                      print(f"FTP admin directory check failed under {target_dir}: {error}")
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                      output.write(f"server_dir={candidate}\n")
                  break
              except Exception as error:
                  failures.append(f"{candidate}: {error}")
              finally:
                  try:
                      ftp.quit()
                  except Exception:
                      pass
          else:
              print("FTP target directory validation failed:")
              for failure in failures:
                  print(f"- {failure}")
              raise SystemExit(1)
          PY

      - name: Sync site files (attempt 1)
        id: ftp_deploy_attempt_1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ${{ steps.resolve_ftp_dir.outputs.server_dir }}
          state-name: .github/ftp-deploy-sync-state.json
          log-level: minimal
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.codex/**
            **/.env
            **/config/local.php
            **/config/local.php72
            **/storage/**
            **/storage-php72/**
            **/tests/**
            **/docker-compose*.yml
            **/Dockerfile*

      - name: Wait before FTP retry 2
        if: ${{ steps.ftp_deploy_attempt_1.outcome == 'failure' }}
        shell: bash
        run: sleep 10

      - name: Sync site files (attempt 2)
        id: ftp_deploy_attempt_2
        if: ${{ steps.ftp_deploy_attempt_1.outcome == 'failure' }}
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ${{ steps.resolve_ftp_dir.outputs.server_dir }}
          state-name: .github/ftp-deploy-sync-state.json
          log-level: minimal
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.codex/**
            **/.env
            **/config/local.php
            **/config/local.php72
            **/storage/**
            **/storage-php72/**
            **/tests/**
            **/docker-compose*.yml
            **/Dockerfile*

      - name: Wait before FTP retry 3
        if: ${{ steps.ftp_deploy_attempt_2.outcome == 'failure' }}
        shell: bash
        run: sleep 20

      - name: Sync site files (attempt 3)
        id: ftp_deploy_attempt_3
        if: ${{ steps.ftp_deploy_attempt_2.outcome == 'failure' }}
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ${{ steps.resolve_ftp_dir.outputs.server_dir }}
          state-name: .github/ftp-deploy-sync-state.json
          log-level: minimal
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.codex/**
            **/.env
            **/config/local.php
            **/config/local.php72
            **/storage/**
            **/storage-php72/**
            **/tests/**
            **/docker-compose*.yml
            **/Dockerfile*

      - name: Fail if all FTP attempts failed
        if: ${{ steps.ftp_deploy_attempt_3.outcome == 'failure' }}
        shell: bash
        run: exit 1
