name: 定时采集图片

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: z-pic-auto-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 触发站点采集任务
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SITE_URL}" || -z "${ADMIN_TOKEN}" ]]; then
            echo "请先配置 SITE_URL 和 ADMIN_TOKEN 两个仓库 Secrets。" >&2
            exit 1
          fi

          response_file="$(mktemp)"
          trap 'rm -f "${response_file}"' EXIT

          curl \
            --fail-with-body \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 20 \
            --max-time 300 \
            --silent \
            --show-error \
            --get \
            --data-urlencode "route=task/collect" \
            --data-urlencode "token=${ADMIN_TOKEN}" \
            "${SITE_URL%/}/index.php" | tee "${response_file}"

          if grep -q '^\[failed\]' "${response_file}"; then
            echo "站点返回了失败的采集结果。" >&2
            exit 1
          fi
