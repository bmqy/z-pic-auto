name: Actions 远程采集

on:
  schedule:
    # GitHub Actions 使用 UTC；每天北京时间 10:00 执行。
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: z-pic-auto-actions-collection
  cancel-in-progress: false

jobs:
  collect:
    name: 调用线上 PHP 采集接口
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检查站点配置
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          for variable in SITE_URL ADMIN_TOKEN; do
            if [[ -z "${!variable}" ]]; then
              echo "缺少 GitHub Secret: ${variable}" >&2
              exit 1
            fi
          done

          case "${SITE_URL}" in
            http://*|https://*) ;;
            *)
              echo "SITE_URL 必须包含 http:// 或 https:// 协议。" >&2
              exit 1
              ;;
          esac

      - name: 调用线上 PHP 采集接口
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          trap 'rm -f "${response_file}"' EXIT

          curl \
            --fail-with-body \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 20 \
            --max-time 300 \
            --silent \
            --show-error \
            --http1.1 \
            --get \
            --data-urlencode "route=task/collect" \
            --data-urlencode "async=1" \
            --data-urlencode "token=${ADMIN_TOKEN}" \
            "${SITE_URL%/}/index.php" | tee "${response_file}"

          if grep -q '^\[failed\]' "${response_file}"; then
            echo "线上 PHP 采集接口返回了失败结果。" >&2
            exit 1
          fi

          if ! grep -q '^\[accepted\]' "${response_file}"; then
            echo "线上 PHP 采集接口未返回异步受理结果。" >&2
            cat "${response_file}" >&2
            exit 1
          fi
