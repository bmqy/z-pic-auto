name: Actions 抓取翻译并入库

on:
  schedule:
    # GitHub Actions 使用 UTC；每天北京时间 10:00 执行。
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: z-pic-auto-actions-collection
  cancel-in-progress: false

jobs:
  collect:
    name: Actions 抓取翻译并调用 PHP 入库
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 安装 PHP 运行环境
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, mbstring, simplexml
          coverage: none

      - name: 检查远程调用配置
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for variable in SITE_URL ADMIN_TOKEN; do
            if [[ -z "${!variable}" ]]; then
              echo "缺少 GitHub Secret: ${variable}" >&2
              exit 1
            fi
          done

          case "${SITE_URL}" in
            http://*|https://*) ;;
            *)
              echo "SITE_URL 必须包含 http:// 或 https:// 协议。" >&2
              exit 1
              ;;
          esac

      - name: Actions 抓取并翻译
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          php -d memory_limit=256M cron/export.php > payload.json
          if [[ ! -s payload.json ]]; then
            echo "Actions 未生成导入数据。" >&2
            exit 1
          fi

      - name: 调用线上 PHP 导入接口
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "${response_file}" payload.json' EXIT

          curl \
            --fail-with-body \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 20 \
            --max-time 300 \
            --silent \
            --show-error \
            --http1.1 \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-Admin-Token: ${ADMIN_TOKEN}" \
            --data-binary @payload.json \
            "${SITE_URL%/}/index.php?route=task%2Fimport" | tee "${response_file}"

          if ! grep -q '"status":"success"' "${response_file}"; then
            echo "线上 PHP 导入接口未返回成功结果。" >&2
            cat "${response_file}" >&2
            exit 1
          fi
